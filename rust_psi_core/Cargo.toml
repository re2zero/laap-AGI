[package]
name = "laap_psi_core"
version = "0.1.0"
edition = "2021"
description = "LAAP PSI Core - Rust performance layer for Clifford algebra, multivectors, and rotors"

[dependencies]
nalgebra = { version = "0.32", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "laap_psi_core"
crate-type = ["cdylib", "rlib"]
